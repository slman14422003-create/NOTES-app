import java.util.Properties

plugins {
    id 'com.android.application'
}

// Release signing: CI passes SIGNING_* environment variables; locally keystore.properties is used.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signStore = System.getenv('SIGNING_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def signStorePass = System.getenv('SIGNING_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def signAlias = System.getenv('SIGNING_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def signKeyPass = System.getenv('SIGNING_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasSigning = signStore && signStorePass && signAlias && signKeyPass

// A release build must ALWAYS use the same permanent key. A random temporary key changes the
// certificate fingerprint on every build, so the fingerprint could never be registered with
// Google (Play Console / developer verification) and updates would refuse to install.
gradle.taskGraph.whenReady { graph ->
    if (!hasSigning && graph.allTasks.any { it.name.toLowerCase().contains('release') && it.path.startsWith(':app:assemble') }) {
        throw new GradleException('Release signing is not configured. Provide KEYSTORE_BASE64, KEYSTORE_PASSWORD, ' +
                'KEY_ALIAS (and KEY_PASSWORD) as GitHub secrets, or a local keystore.properties. See SIGNING.md.')
    }
}

android {
    namespace = 'com.semo.notes'
    compileSdk = 36   // Android 16

    defaultConfig {
        applicationId = "app.semo.notes"
        minSdk = 24
        targetSdk = 36   // Android 16
        // CI run number keeps versionCode increasing so a new build always installs over the old one
        versionCode = (System.getenv('VERSION_CODE_OVERRIDE') ?: (10 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()).toString()).toInteger()
        // CI passes the release tag (without the leading v) so the installed version matches the Release tag
        versionName = System.getenv('APP_VERSION_NAME') ?: "1.0"
    }

    buildFeatures {
        buildConfig = true
    }

    // No build-time metadata that identifies the toolchain inside the APK
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile = file(signStore)
                storePassword = signStorePass
                keyAlias = signAlias
                keyPassword = signKeyPass
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'DebugProbesKt.bin']
    }
}

dependencies {
    // Aligns every Kotlin artifact to one version (fixes "Duplicate class kotlin.collections.jdk8...")
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Sign in with Google (Credential Manager) - the Google ID token is exchanged for a Firebase session over REST
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// ---------------------------------------------------------------------------------------------
// Build-time string encryption. The Firebase identifiers, the Google web client ID, the update
// repository and the expected signing-certificate fingerprint are NOT written into the APK as
// readable strings: every build generates a fresh random key and a Secrets.java that only holds
// scrambled bytes. This hides them from strings/grep on the APK and from casual decompiling
// (R8 then renames everything). It is obfuscation, not a secret store: the real protection of
// the data is the Firestore rules + the signed-in Google account, never these values.
// ---------------------------------------------------------------------------------------------
def secretsValues = [
        apiKey     : (System.getenv('FIREBASE_API_KEY') ?: 'AIzaSyCvXS6nZ2md4xRVyUDtPNOMgL5ShUCADXI').trim(),
        projectId  : (System.getenv('FIREBASE_PROJECT_ID') ?: 'semo-7770a').trim(),
        webClientId: (System.getenv('WEB_CLIENT_ID') ?: '').trim(),
        updateRepo : (System.getenv('UPDATE_REPO') ?: System.getenv('GITHUB_REPOSITORY') ?: '').trim(),
        certSha256 : (System.getenv('EXPECTED_CERT_SHA256') ?: '').trim().replace(':', '')
]
def secretsDir = new File(layout.buildDirectory.get().asFile, 'generated/secrets/java')
def secretsPkg = new File(secretsDir, 'com/semo/notes')
secretsPkg.mkdirs()
def rnd = new java.security.SecureRandom()
byte[] partA = new byte[32]
byte[] partB = new byte[32]
rnd.nextBytes(partA)
rnd.nextBytes(partB)
def asJava = { byte[] arr ->
    def sb = new StringBuilder('new byte[]{')
    for (int i = 0; i < arr.length; i++) {
        if (i > 0) sb.append(',')
        sb.append((int) arr[i])
    }
    sb.append('}')
    return sb.toString()
}
def scramble = { String text ->
    byte[] plain = text.getBytes('UTF-8')
    byte[] out = new byte[plain.length]
    for (int i = 0; i < plain.length; i++) {
        int k = (partA[i % 32] ^ partB[i % 32]) & 0xFF
        out[i] = (byte) ((plain[i] ^ k ^ (i * 31)) & 0xFF)
    }
    return out
}
def secretsSrc = new StringBuilder()
secretsSrc.append('package com.semo.notes;\n\n')
secretsSrc.append('/** Generated at build time - do not edit. Values are scrambled with a per-build random key. */\n')
secretsSrc.append('final class Secrets {\n    private Secrets() {\n    }\n\n')
secretsSrc.append('    private static final byte[] A = ').append(asJava(partA)).append(';\n')
secretsSrc.append('    private static final byte[] B = ').append(asJava(partB)).append(';\n\n')
secretsSrc.append('    private static String d(byte[] c) {\n')
secretsSrc.append('        byte[] o = new byte[c.length];\n')
secretsSrc.append('        for (int i = 0; i < c.length; i++) {\n')
secretsSrc.append('            o[i] = (byte) (c[i] ^ A[i % 32] ^ B[i % 32] ^ (i * 31));\n')
secretsSrc.append('        }\n')
secretsSrc.append('        return new String(o, java.nio.charset.StandardCharsets.UTF_8);\n')
secretsSrc.append('    }\n')
secretsValues.each { name, value ->
    secretsSrc.append('\n    static String ').append(name).append('() {\n        return d(')
            .append(asJava(scramble(value))).append(');\n    }\n')
}
secretsSrc.append('}\n')
new File(secretsPkg, 'Secrets.java').setText(secretsSrc.toString(), 'UTF-8')
android.sourceSets.main.java.srcDir(secretsDir)
